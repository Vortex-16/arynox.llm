version: '3.8'

services:
  # Reference: ChromaDB Vector Database
  chroma:
    image: chromadb/chroma:latest
    container_name: arynox-chroma
    ports:
      - "8000:8000"
    volumes:
      - ./my_local_chroma_data:/index_data
    environment:
      - IS_PERSISTENT=TRUE
      - ALLOW_RESET=TRUE
    restart: always

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: arynox-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHROMA_URL=http://chroma:8000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    depends_on:
      - chroma
    restart: always

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: arynox-client
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - server
    restart: always
